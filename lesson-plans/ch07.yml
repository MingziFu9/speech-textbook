# 第 7 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 7
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出声纹和声纹向量的含义，用余弦相似度手算两个小向量有多像
  - 区分说话人确认、说话人辨认、说话人日志三种任务，各举一个应用例子
  - 说出声纹属于敏感个人信息，采集和使用需要取得本人单独同意
  - 解释语音转换把“说什么”和“谁在说”分开的思路，说出它和第 8 章语音克隆的区别
  skill:
  - 解释门槛如何影响误接受率和误拒绝率，能根据场景选择门槛
  - 运行并修改代码，完成声纹比对、声纹登录和多人会议“谁在说话”的纪要
  quality:
  - 认识声纹是敏感个人信息，采集和使用要取得本人单独同意，泄露后无法更换
  - 理解实验室结果和真实场景的差距，形成审慎评估技术的习惯
key_points:
- 声纹：嗓子的“指纹”
- 两串数字有多像：余弦相似度
- 门槛的取舍：两种错误
- 三种任务：确认、辨认、日志
difficulties:
- point: 余弦相似度的含义和计算
  solution: 用两个二维小向量手算余弦相似度，再用“声纹地图”动画看 45 段录音的分布
- point: 门槛与误接受率、误拒绝率的此消彼长
  solution: 用“门槛与两种错误”动画拖动门槛，切换电话音质；分组讨论银行、门禁、会议纪要怎样定门槛
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 7 章 声纹识别与语音转换，操作交互动画“声纹地图”“门槛与两种错误”；完成本章 ★ 实验 7-1～7-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：两件新鲜事：居委会想做“老人专线”，一开口就认出是哪位老人；议事会纪要分不清哪句是主持人、哪句是老王。两件事都要电脑“听出是谁在说话”。
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 20
    content: 声纹向量与余弦相似度
    teacher: 全班手算二维向量的余弦相似度；演示“声纹地图”
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 20
    content: 门槛与两种错误；三种任务
    teacher: 演示“门槛与两种错误”，切换电话音质；分组讨论场景门槛
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二
  - name: 重点讲授
    minutes: 15
    content: 声纹的风险与隐私；语音转换
    teacher: 讲个保法第二十八、二十九条，讨论“老人专线”应怎样告知和同意；对比语音转换和克隆
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 树立隐私与伦理意识
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 7-1～7-3，重点讲注册模板取平均、FAR/FRR 的统计、日志结果和标准答案对齐
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：请用自己的话说明说话人确认、说话人辨认、说话人日志的区别，各举一个生活中的例子。
- 简答题：银行声纹登录和会议纪要分人，门槛的选择有什么不同？为什么？
- 简答题：实验 7-3 中，说话人日志把主持人的话分给了李阿姨，请分析可能的原因，并提出两种改进方法。
- 实操题：修改 `lab7_2_login.py`：注册时只用每人的第 1 段录音，并在第 6 步增加一种条件“加噪声”（在本人录音上加 `0.02 * np.random.randn(len(a))` 的噪声）。记录三种条件下门槛 0.75 的误拒绝率，写出结论。
- 实验报告：实验 7-1、实验 7-2、实验 7-3、实验 7-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
