# 第 6 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 6
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出本书四个中文合成模型（Matcha、VITS AISHELL-3、MeloTTS、Kokoro）的特点，按需求选出合适的模型
  - 解释多说话人合成中说话人编号和语速两个参数的作用，能用时长和平均音高验证
  - 读懂简单的 SSML，说出云平台合成和本地模型各自的优缺点
  - 说出《人工智能生成合成内容标识办法》对音频的显式标识和隐式标识要求，并在自己的作品里加上标识
  skill:
  - 运用标点、分句、句间停顿和改写英文写法，让合成读得更自然
  - 实现一条有声书流水线：分句、批量合成、统一音量、加停顿和片头、导出 MP3 和目录
  quality:
  - 发布 AI 合成的声音时主动加显式标识和隐式标识，遵守《人工智能生成合成内容标识办法》
  - 妥善保管云平台 API Key，不把密钥写进代码或发到网上
  - 从老年居民的需要出发选择音色和语速，体现服务意识
key_points:
- 四个中文合成模型怎么选
- 一个模型，多种声音
- 用 sherpa-onnx 合成：三步
- 读得更自然
difficulties:
- point: 多说话人模型、说话人编号和语速参数
  solution: 用“音色与语速调台”动画现场比较 6 种声音、3 种语速，让学生为老年人广播选一组参数
- point: 有声书流水线的各个环节和两种标识
  solution: 现场运行实验 6-3，打开 MP3 播放并用 ffprobe 读出元数据，逐步对照流程图
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 6 章 语音合成实战：多音色与有声书，操作交互动画“音色与语速调台”；完成本章 ★ 实验 6-1～6-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：冬天到了，居委会、物业和卫生服务站写了一份 1500 字的《冬季安全与便民服务告居民书》，要做成老人能反复听的有声书，还要让大家知道这是机器读的。
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 20
    content: 四个中文合成模型的选择；说话人编号与语速
    teacher: 对照模型比较表讲选型；演示“音色与语速调台”动画
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一，联系老年人需求
  - name: 重点讲授
    minutes: 20
    content: 读得更自然：标点、分句、中英混读；有声书流水线
    teacher: 展示中英混读结果表；现场演示实验 6-3
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二
  - name: 重点讲授
    minutes: 15
    content: 云平台与 SSML；合成声音的两种标识
    teacher: 讲解 SSML 例子和 API Key 保管；用 ffprobe 读出 MP3 的隐式标识
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 落实标识法规要求
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 6-1～6-3，重点讲配置类不同、采样率跟着模型走、ffmpeg 安装和元数据
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：为什么做有声书时要先分句、逐句合成，而不是整篇一次合成？
- 简答题：社区要做一段冬季安全提醒音频，在广场大喇叭和业主群里同时发布。请为它设计显式标识和隐式标识。
- 简答题：请根据实验 6-2 的结果，比较 Matcha、MeloTTS、Kokoro 三个模型的中英混读能力，并说明“回识别”在这个实验中的作用和局限。
- 实操题：修改 `lab6_3_audiobook.py`：（1）正文改用 Kokoro 20 号音色、语速 0.9；（2）结尾也加一句“本音频由人工智能语音合成”；（3）把 MP3 比特率改成 32 kbps。运行后记录合成用时、总时长和 MP3 大小，并说明 32 kbps 是否适合发到业主群。
- 实验报告：实验 6-1、实验 6-2、实验 6-3、实验 6-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
