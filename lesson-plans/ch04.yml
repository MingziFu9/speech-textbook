# 第 4 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 4
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出本书用到的几个识别模型各自的特点，能根据场景（语种、速度、是否实时、能否联网）选择模型
  - 解释语音活动检测、标点恢复、逆正则化的作用，能把一段长录音做成 SRT 字幕
  - 区分流式和非流式识别，说出语音唤醒中误唤醒和漏唤醒的取舍
  skill:
  - 写出用 sherpa-onnx 识别一段录音的四个步骤，处理好采样率和声道
  - 分析噪声、方言、专有名词对识别的影响，会用热词和拼音纠错改进专有名词
  - 遵守录音告知和妥善保存的要求
  quality:
  - 遵守录音告知、最少收集、安全保存的要求，处理居民录音时保护个人信息
  - 在自己的数据上评测模型，不迷信别人的排行榜
key_points:
- 现成的识别模型怎么选
- 用 sherpa-onnx 识别：四步走
- 长录音：切句、标点和字幕
- 文本逆正则化：把“说法”变成“写法”
difficulties:
- point: VAD 参数怎样影响切句结果
  solution: 用“VAD 切句”动画调最短静音 0.2、0.5、1.0 秒，对照实验 4-2 的 10、7、5 句
- point: 误唤醒和漏唤醒的取舍
  solution: 展示实验 4-3 阈值 0.1～0.9 的结果表，讨论服务站大屏和手机助手分别该怎样定阈值
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 180
    content: 阅读网页教材第 4 章 语音识别实战：转写、字幕与唤醒，操作交互动画“VAD 切句”；完成本章 ★ 实验 4-1～4-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：服务站正式上线前的任务单：来电转文字存档、议事会录音做字幕、说“你好小站”才亮屏、“樟树苑”“韦嘉怡”老被认错。本章逐项完成。
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 选模型的四个问题；sherpa-onnx 识别四步；VAD 切句与 SRT 字幕
    teacher: 对照实验 4-1 的结果表讲选型；演示“VAD 切句”动画
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一，落实技能目标
  - name: 重点讲授
    minutes: 5
    content: 流式识别、唤醒阈值、热词与录音隐私
    teacher: 讨论唤醒阈值的取舍，对比热词和拼音纠错的效果
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，树立隐私意识
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 4-1～4-3，重点讲采样率要如实给出、唤醒词转拼音、字幕时间格式
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：写出用 sherpa-onnx 识别一段录音的四个步骤，并说明处理双声道、44.1 kHz 录音时要注意什么。
- 简答题：什么是“两遍识别”？它解决了什么问题？
- 简答题：社区服务站的大屏被说“你好小张”的居民误唤醒了好几次。请从至少两个方面提出改进办法，并说明各自的代价。
- 实操题：把实验 4-2 改造成一个“录音转文字小工具”：给定任意一个 WAV 文件路径，自动 VAD 切句、逐句识别，输出同名的 `.srt` 字幕和 `.txt` 文字稿（每行一句，前面加上 `[开始秒]`）。用你自己录的一段 1 分钟左右的录音测试。
- 实验报告：实验 4-1、实验 4-2、实验 4-3、实验 4-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
