# 第 5 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 5
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出语音合成要解决的三个问题，以及合成系统三块积木各自的输入和输出
  - 解释文本正则化、分词、多音字、变调、韵律停顿在文本前端中的作用，能指出一句话里哪些地方容易读错
  - 比较拼接合成、统计参数合成、神经网络合成、大模型合成四个阶段的做法和听感
  - 说出声码器的作用，从音质和速度两方面比较几种声码器
  skill:
  - 运行并修改代码，做一个能处理数字和多音字的文本前端，把它和声学模型、声码器连起来合成语音
  - 组织一次小组 MOS 打分，结合回识别字错率评出最好的合成版本
  quality:
  - 从“机器读错字”体会文本前端规则的细致与局限，培养精益求精的态度
  - 使用开源模型时查看模型和训练数据的许可，尊重知识产权
key_points:
- 语音合成要解决什么
- 合成系统的三块积木
- 文本前端：读得对
- 语音合成的四个阶段
difficulties:
- point: 文本正则化、多音字和变调为什么难
  solution: 用“文本前端流水线”动画逐步演示；让学生找出一段社区通知里所有可能读错的地方
- point: 声码器在合成系统中的作用
  solution: 用“从频谱到声音”动画听同一张频谱交给三种声码器的结果，比较音质和速度
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 5 章 语音合成原理：从文字到声音，操作交互动画“文本前端流水线”“从频谱到声音”；完成本章 ★ 实验 5-1～5-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：广播里“2026-11-08”被念成一串怪数字，“王大夫”念成了“大 fū”，有的合成声音一听就是机器。机器是怎样“读”文字的？
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 25
    content: 合成三块积木；文本前端：正则化、分词、多音字、变调、韵律
    teacher: 演示“文本前端流水线”动画；分组找通知里的读错点并给出规则
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 15
    content: 合成的四个阶段与声码器
    teacher: 播放实验 5-2 拼接版和整句版，对比音高曲线；演示“从频谱到声音”动画
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二
  - name: 重点讲授
    minutes: 15
    content: 课堂盲听 MOS 打分（实验 5-4）
    teacher: 组织盲听打乱顺序的 5 个版本，汇总全班 MOS，与回识别字错率对照
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 体验主观评价，理解客观指标不能代替耳朵
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 5-1～5-3，重点讲正则规则的顺序、自定义词典、前端输出转模型编号
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：以“请到3号楼找王大夫，电话13912345678”为例，说明文本前端要做哪些处理，每一步的结果是什么。
- 简答题：比较拼接合成和神经网络合成的优缺点，说明为什么神经网络合成成为主流。
- 简答题：为什么评价合成语音既要用 MOS，又要用回识别字错率？两者各有什么局限？
- 实操题：给 `frontend.py` 增加两条正则化规则：“3-5人”读成“三到五人”，“-3℃”读成“零下三摄氏度”。修改后用实验 5-3 的流程合成“今天最低气温-3℃，请3-5人一组参加活动”，并用回识别检查。
- 实验报告：实验 5-1、实验 5-2、实验 5-3、实验 5-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
