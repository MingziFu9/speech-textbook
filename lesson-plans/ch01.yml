# 第 1 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 1
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出语音识别、语音合成、语音克隆、声纹识别、语音唤醒五类任务分别做什么，各举一个生活中的例子
  - 解释一次语音对话要经过唤醒、识别、理解、回答、合成五个环节，以及每个环节的输入和输出
  - 区分 TTS、STT、ASR、SST 这几个名称，说出语音技术发展的几个阶段
  skill:
  - 运行给定的代码，让电脑朗读一段文字、把一段录音转成文字，并修改文字和语速
  - 判断一个语音应用用到了哪几类语音任务，录别人的声音前需要做什么
  quality:
  - 树立“声音也是个人信息”的意识，录别人的声音先告知、先征得同意
  - 养成动手验证、如实记录运行结果的习惯
key_points:
- 身边的语音技术
- 一次语音对话里发生了什么
- 语音技术简史
- TTS、STT、ASR、SST：几个名称
difficulties:
- point: 一次语音对话五个环节各自的输入和输出
  solution: 用“语音对话流水线”动画逐个点开五个环节，让学生说出每一步“进来什么、出去什么”
- point: 第一次运行代码时的环境和路径问题
  solution: 课前发布环境检查程序，课上集中演示“先进入章文件夹再运行”，展示常见报错表
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 180
    content: 阅读网页教材第 1 章 走进语音技术，操作交互动画“语音对话流水线”；完成本章 ★ 实验 1-1～1-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：幸福里社区 3000 多户居民、6 名工作人员，同样的问题一天回答几十遍。书记想建“社区语音服务站”，林老师愿意让机器学自己的声音：这些能实现吗？要先办什么手续？
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 五类语音任务与一次语音对话的五个环节
    teacher: 用生活例子引出五类任务，演示“语音对话流水线”动画
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 建立全书的知识框架
  - name: 重点讲授
    minutes: 5
    content: 名称辨析（TTS、STT、ASR、SST）、模型与 sherpa-onnx；先说规矩：声音也是个人信息
    teacher: 对照表格辨析名称；讲清本书实验的声音全部是合成的，强调告知与同意
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 厘清概念，树立隐私意识
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 1-1～1-3，重点讲进入章文件夹、模型下载、`speak` 和 `transcribe` 的用法
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：以“对智能音箱说‘明天早上七点叫我起床’”为例，说明一次语音交互经过的五个环节，以及每个环节的输入和输出。
- 简答题：社区要把居民来电录音转成文字存档。比较用云端识别服务和用离线模型各自的优缺点，并给出你的建议。
- 简答题：为什么说“声纹识别”和“语音识别”关注的东西正好相反？
- 实操题：修改实验 1-3 的代码：让程序依次处理 `call_01.wav`、`call_03.wav`、`call_07.wav` 三段来电（提示：用 `for` 循环），对“垃圾分类”“卫生服务站”“老年食堂”三类问题各写一句回复，其余问题用默认回复；把每段的回复保存成 `reply_01.wav` 这样的文件，打印每段的识别结果和回复。
- 实验报告：实验 1-1、实验 1-2、实验 1-3、实验 1-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
