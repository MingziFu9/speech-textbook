# 第 3 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 3
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出语音识别要克服的几个难题，以及识别系统由哪四个部分组成、各管什么
  - 解释模板匹配和 DTW 的思路，能在小例子上找出两段快慢不同的序列怎样对齐
  - 用比喻说明隐马尔可夫模型中“看不见的状态”和“听得到的声音”是什么关系
  - 区分 CTC、编码器—解码器、非自回归几类端到端模型，能把一串逐帧输出折叠成文字
  skill:
  - 手算并用代码算出字错率、词错率和实时率，读懂混淆矩阵
  - 运行并修改代码，做出一个能认 0—9 的数字识别器，用语言模型给同音候选句打分
  quality:
  - 通过七十年的技术演进，体会“发现局限—提出新方法”的科学探索过程
  - 认识到模型只懂它“见过”的数据，客观看待技术的能力边界
key_points:
- 语音识别难在哪里
- 识别系统的四块积木
- 第一代：模板匹配与 DTW
- 第二代：隐马尔可夫模型
difficulties:
- point: DTW 怎样让快慢不同的两段语音对齐
  solution: 用“DTW 对齐”动画调语速和停顿，对比逐帧硬比和 DTW 的距离
- point: CTC 输出的折叠和字错率的计算
  solution: 用“CTC 折叠”动画逐步合并重复、删空白；用“字错率计算器”现场手算一例再验证
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 180
    content: 阅读网页教材第 3 章 语音识别原理：从模板匹配到深度学习，操作交互动画“DTW 对齐”“CTC 折叠”“字错率计算器”；完成本章 ★ 实验 3-1～3-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：服务站上线一个月，总有奇怪的错字：“卫生”听成“医生”、“充电桩”写成“充电装”。二十年前的语音拨号换个人说就不灵。机器到底是怎么“听”的？
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 四块积木；模板匹配与 DTW；HMM 的“隔墙听骰子”
    teacher: 演示“DTW 对齐”动画；用骰子比喻讲隐状态和观察
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 5
    content: 端到端模型与 CTC；语言模型；字错率与实时率
    teacher: 演示“CTC 折叠”“字错率计算器”，全班手算一例字错率
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 3-1～3-3，重点讲 MFCC 形状、hmmlearn 训练、总字错率不能简单平均
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：用自己的话说明模板匹配、HMM、端到端模型三代识别方法各自的基本思路，以及后一代解决了前一代的什么问题。
- 简答题：为什么一批录音的总字错率要用“总错误数 ÷ 总字数”计算，而不是把每段的字错率求平均？举例说明。
- 简答题：社区服务站的识别系统经常把本小区的名字“幸福里”识别成“幸福利”。根据本章知识，提出两种改进办法。
- 实操题：修改实验 3-2 的代码，做一个“说话人无关”的测试：用 george、jackson、lucas 三个人的全部录音训练，用 nicolas 的全部录音测试，记录准确率；再分别把其他三个人轮流作为测试人，比较 4 次的结果，写一段分析。
- 实验报告：实验 3-1、实验 3-2、实验 3-3、实验 3-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
