# 第 2 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 2
online: 7
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出声音是怎样产生和传播的，音高、响度、音色分别由什么决定
  - 解释采样率、位深、声道的含义，用采样定理判断一个采样率够不够用，并算出一段录音的文件大小
  - 读懂波形图、频谱和语谱图，从图上认出静音、削波、噪声、元音的共振峰
  - 说出梅尔频谱和 MFCC 是什么、为什么语音模型用它们而不直接用采样点
  skill:
  - 运行并修改代码，批量完成格式统一、去静音、音量归一化，用识别结果检查整理效果
  - 判断一段录音的毛病出在哪里、哪些毛病事后能补救、哪些只能重录
  quality:
  - 体会“好数据胜过事后补救”，录音时注意环境、距离和告知
  - 用数据（字错率）而不是感觉评价处理效果，培养严谨的工程态度
key_points:
- 声音是什么
- 把声音存进电脑
- 音频文件格式：WAV、MP3、FLAC
- 看声音的三种图
difficulties:
- point: 采样定理和混叠：为什么最高只能记录采样率的一半
  solution: 用“采样与量化”动画把采样率固定在 8000 Hz，慢慢调高声音频率，观察 4000 Hz 以上的混叠
- point: 读懂语谱图
  solution: 用“看见声音”动画对照波形图和语谱图，让学生说出元音、口哨、噪声、敲门声各自的样子
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 180
    content: 阅读网页教材第 2 章 声音的数字化与音频处理，操作交互动画“采样与量化”“看见声音”；完成本章 ★ 实验 2-1～2-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：小周导出一周的居民来电准备批量转文字：有的识别不出，有的满屏错字。双声道、8 kHz、声音太小、削波、噪声、长静音……这些录音到底差在哪里？
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 10
    content: 采样、量化与文件大小
    teacher: 演示“采样与量化”动画；全班口算 1 分钟 16 kHz 单声道 16 位录音的大小（约 1.83 MB）
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 5
    content: 波形图、语谱图与梅尔频谱；音频处理基本功
    teacher: 演示“看见声音”动画，让学生看图判断录音毛病
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，联系实验 2-3
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 2-1～2-3，重点讲中文字体、批量处理循环、削波能否补救
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 5
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：什么是采样定理？用它解释为什么电话里的“四”和“十”容易听混。
- 简答题：语音识别模型为什么一般不直接用采样点作为输入，而用梅尔频谱？
- 简答题：实验 2-3 中，整理后 8 段录音有 7 段字错率没有变化，1 段反而变差。请分析原因，并说明整理录音还有什么意义。
- 实操题：用手机在两种环境下各录一段同样的话（例如“你好，我想报名参加社区志愿服务”）：一段在安静的房间、正常距离；一段在有噪声的地方（开着电视或在窗边），或者离手机很远。用实验 2-1 和 2-3 的代码，画出两段录音的波形图和语谱图，算出时长、峰值和字错率，写一段对比分析。
- 实验报告：实验 2-1、实验 2-2、实验 2-3、实验 2-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
