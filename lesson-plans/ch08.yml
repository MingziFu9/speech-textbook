# 第 8 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 8
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出语音克隆的含义，比较微调式克隆和零样本克隆在数据、成本、效果、风险上的区别
  - 说出《民法典》第一千零二十三条、《个人信息保护法》第二十八条和第二十九条、深度合成规定、生成式人工智能办法、标识办法中与声音有关的要求，能判断一个克隆情境是否合规
  skill:
  - 按要求准备一段合格的参考音，并用程序检查它的质量
  - 运行并修改代码，用零样本模型克隆授权声音，从相似度、字错率、自然度三方面评价克隆效果
  - 写出一份要素齐全的声音使用授权书
  - 给克隆作品加上显式标识、隐式标识和简单水印，说出个人防范“AI 声音诈骗”的方法
  quality:
  - 牢记“克隆谁的声音先拿谁的授权，作品出门必须标识”，坚守科技伦理底线
  - 了解 AI 声音诈骗的手法，能把防诈建议讲给家人和社区老人
  - 尊重配音演员等从业者的声音权益
key_points:
- 什么是语音克隆
- 两条技术路线
- 参考音怎么准备
- 克隆效果怎么评价
difficulties:
- point: 零样本克隆为什么几秒参考音就够，参考音长度和生成步数怎样影响结果
  solution: 用“参考时长与相似度”动画听 2.8～14.2 秒参考音和 1～16 步的克隆结果，对照相似度
- point: 把多部法规落到具体情境里判断是否合规
  solution: 全班做“这样克隆合规吗”10 道情境题，逐题讲依据条款；结合北京互联网法院判例讨论“录音著作权不等于 AI 化授权”
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 8 章 语音克隆：技术、伦理与授权，操作交互动画“参考时长与相似度”“这样克隆合规吗”；完成本章 ★ 实验 8-1～8-3，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：一好一坏两件事：志愿者 B 要离开半年，主动提出做个“AI 播音员”；王阿姨接到“孙子”哭着要 2 万元的电话，声音口气一模一样。同一项技术，一边是温暖，一边是诈骗。
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 20
    content: 语音克隆的两条路线；参考音与效果评价
    teacher: 演示“参考时长与相似度”动画；强调只用虚拟授权人或已签授权书的本人声音
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 25
    content: 法律与规则：民法典、个保法、深度合成规定、生成式 AI 办法、标识办法；判例
    teacher: 讲解法条要点和判例；组织“这样克隆合规吗”情境判断
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，树立法治意识
  - name: 重点讲授
    minutes: 10
    content: 授权书、标识与水印、个人防诈
    teacher: 逐条讲授权书模板；演示水印检测；讲给家人的四条防诈建议
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 落实授权和标识，服务社区
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 8-1～8-3，重点讲参考音文字必须一字不差、不使用模型包自带示例音频、水印门槛
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：请比较微调式克隆和零样本克隆，并说明为什么零样本克隆的风险更大。
- 简答题：社区想用志愿者 B 的声音做 AI 播音员。请列出从开始到发布要做的合规步骤。
- 简答题：用自己的话解释实验 8-3 中简单水印的原理，并说明它的局限。
- '实操题：修改 `lab8_3_label.py`：（1）在结尾也加一句“以上内容由人工智能合成”；（2）在元数据里增加授权书编号 `"License": "SQ-2026-001"`；（3）把水印强度改成 0.01，检测有水印的 MP3 得分。记录结果并说明水印强度的取舍。'
- 实验报告：实验 8-1、实验 8-2、实验 8-3、实验 8-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
