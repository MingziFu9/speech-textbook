# 第 9 章教案，底稿由 python tools/make_lesson_plan.py draft 生成，编者已补写。
# 字段说明见 lesson-plans/README.md
chapter: 9
online: 6
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 画出语音助手“唤醒 → 识别 → 理解 → 回答 → 合成”的全链路，算出用户的等待时间
  - 说出模型量化和端侧部署的作用，会比较量化前后的大小和速度
  skill:
  - 拆解智能客服、车载语音、会议纪要等行业案例，说出各用了哪些语音模块
  - 从准确、速度、自然、体验四个方面设计一个语音系统的评估方案
  - 运行并修改代码，做出语音问答小助手，并用 Gradio 做成网页
  - 完成一个综合项目，写出项目报告和合规自查表
  quality:
  - 在项目中落实告知、授权、标识和隐私保护，对用户和社会负责
  - 通过小组项目培养分工协作、表达和答辩能力
key_points:
- 一次语音对话的全链路
- 语音大模型：边听边说
- 行业案例拆解
- 怎样评估一个语音系统
difficulties:
- point: 全链路延迟由哪些部分组成，应先优化哪里
  solution: 用“延迟拆解”动画调各环节耗时，对照实验 9-4 实测：等说完 0.5 秒是最大的一块
- point: 综合项目的选题、分工与合规自查
  solution: 讲解四个选题和评分表，展示附录 D 的项目报告模板和合规自查表，各组当堂确定选题和分工
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习与线上实验
    minutes: 135
    content: 阅读网页教材第 9 章 语音交互应用与综合项目，操作交互动画“延迟拆解”；完成本章 ★ 实验 9-1、9-2，填写实验记录表
    teacher: 在学习平台发布预习任务、预习问题和实验要求
    student: 阅读教材、操作动画、运行实验代码，在讨论区提出疑问
    intent: 线上完成知识学习和基础实验，带着问题进课堂
- phase: 课中（线下面授）
  steps:
  - name: 情景导入
    minutes: 5
    content: 情景导入：热线越来越忙，书记想做一个“语音小助手”。小周手里的零件都齐了：识别、唤醒、合成、声纹、克隆。这一章把全书串起来，每个人完成自己的综合项目。
    teacher: 讲述情景，提出本章要解决的问题，检查课前预习情况
    student: 回答问题，提出预习中的疑问
    intent: 联系社区语音服务站贯穿项目，激发学习兴趣
  - name: 重点讲授
    minutes: 20
    content: 全链路与延迟；语音大模型；行业案例拆解
    teacher: 演示“延迟拆解”动画；分组拆解智能客服、车载语音案例
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点一
  - name: 重点讲授
    minutes: 15
    content: 评估四方面与体验设计；Gradio；模型量化与端侧部署
    teacher: 展示实验 9-1 的“刁钻问题”和量化对比表
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 形成工程评估意识
  - name: 重点讲授
    minutes: 20
    content: 伦理回顾与综合项目布置
    teacher: 回顾全书合规要点表；讲解选题、评分和一票否决项，各组确定选题
    student: 听讲、操作动画、跟着计算、回答提问
    intent: 突破难点二，启动综合项目
  - name: 实验答疑
    minutes: 15
    content: 答疑实验 9-1、9-2，重点讲关键词匹配、兜底回复、Gradio 组件和端口
    teacher: 演示关键步骤，巡视指导，集中讲评常见错误
    student: 完成实验或提出实验中遇到的问题
    intent: 解决线上实验中的困难，落实技能目标
  - name: 课堂练习
    minutes: 10
    content: 在网页上完成本章课堂练习（课件末尾 3 题）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 4 题），完成 ☆ 拓展实验（选做），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：请列出语音问答小助手的各个环节，并说明怎样把用户的等待时间缩短到 1 秒左右。
- 简答题：任选一个行业案例（智能客服、车载语音、会议纪要、口语评测、无障碍、配音），说出它用了哪些语音模块，主要难点是什么，涉及哪些合规问题。
- 简答题：为什么说“能用小模型就不用大模型”也是一种负责任的选择？
- 实操题：修改 `assistant.py` 的 `understand` 函数：（1）关键词命中数相同时，选关键词更长的那一条；（2）至少命中 1 个关键词且关键词总长度不少于 2 个字才算匹配，否则返回兜底。用实验 9-1 第 2 步的 4 个问题测试，记录结果。
- 实验报告：实验 9-1、实验 9-2、实验 9-3、实验 9-4
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
