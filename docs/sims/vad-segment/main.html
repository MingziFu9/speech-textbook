<h1>VAD 切句：把长录音切成一句一句</h1>
<div class="sub">灰色是议事会录音（51 秒，三个人轮流说 7 句话）每 50 毫秒的音量；绿色方块是“检测到有人说话”的段落，下面的细条是标准答案。拖动三个滑块，看切出几句、切得准不准。</div>
<canvas id="cv" width="1000" height="220"></canvas>
<div class="ctl">
  <span>音量门槛</span><input type="range" id="th" min="-34" max="-5" step="1" value="-25"><span class="mono" id="thv"></span>
  <span>最短静音（秒）</span><input type="range" id="ms" min="0.05" max="1.5" step="0.05" value="0.5"><span class="mono" id="msv"></span>
  <span>最短语音（秒）</span><input type="range" id="mp" min="0.05" max="1" step="0.05" value="0.25"><span class="mono" id="mpv"></span>
</div>
<table class="t"><tr><th>切出的段数</th><th>标准答案</th><th>说明</th></tr><tr><td id="n" class="big"></td><td>7 句</td><td id="ex" style="text-align:left"></td></tr></table>
<div class="note">真正的 VAD（实验 4-2 用的 Silero VAD）是一个小神经网络，判断的是“像不像人声”，不只看音量，所以背景有噪声时也比单纯看音量可靠；“最短静音”“最短语音”两个参数的作用和这里完全一样。实验 4-2 中，最短静音 0.5 秒切出 7 句，0.2 秒切出 10 句，1.0 秒切出 5 句。</div>
