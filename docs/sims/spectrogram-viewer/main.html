<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看见声音</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
canvas { width:100%; border:1px solid var(--line); border-radius:8px; background:#000; display:block; }
#wave { height:110px; background:#fff; }
#spec { height:220px; margin-top:6px; }
.lbl { font-size:12px; color:var(--muted); margin:6px 0 2px; }
</style>
</head>
<body>
<h1>看见声音：同一段声音的波形图和语谱图</h1>
<div class="sub">选一种声音，上面是波形图（横轴时间、纵轴振幅），下面是语谱图（横轴时间、纵轴频率 0—8000 Hz、越亮能量越强）。点“播放”可以听。</div>
<div class="row" id="btns"></div>
<div class="lbl">波形图</div><canvas id="wave" width="900" height="110"></canvas>
<div class="lbl">语谱图（0—8000 Hz）</div><canvas id="spec" width="900" height="220"></canvas>
<div class="row"><button class="main" id="play">▶ 播放</button></div>
<div class="msg" id="msg"></div>
<div class="note">这些声音都是网页现场用公式生成的：元音用“脉冲 + 共振峰滤波器”模拟，和实验 2-1 用的方法相同，数值上不完全一样。真实录音的语谱图见实验 2-1。</div>
<script>
(function () {
  var SR = 16000, N = SR * 1.2;
  function pulses(f0) { var x = new Float32Array(N), ph = 0, last = 0; for (var i = 0; i < N; i++) { ph += (f0 + 15 * Math.sin(Math.PI * i / N)) / SR; var k = Math.floor(ph); if (k !== last) { x[i] = 1; last = k; } } return x; }
  function reson(x, f, bw) { var r = Math.exp(-Math.PI * bw / SR), a1 = -2 * r * Math.cos(2 * Math.PI * f / SR), a2 = r * r, y = new Float32Array(x.length), y1 = 0, y2 = 0;
    for (var i = 0; i < x.length; i++) { var v = (1 - r) * x[i] - a1 * y1 - a2 * y2; y[i] = v; y2 = y1; y1 = v; } return y; }
  function vowel(fs, f0) { var x = pulses(f0 || 200); fs.forEach(function (p) { x = reson(x, p[0], p[1]); }); return x; }
  function tone(fn) { var x = new Float32Array(N); for (var i = 0; i < N; i++) x[i] = fn(i / SR); return x; }
  var SOUNDS = [
    ["纯音 1000 Hz", function () { return tone(function (t) { return Math.sin(2 * Math.PI * 1000 * t); }); },
      "只有一条亮线：纯音只有一个频率。手机拨号音、测听力用的“嘀”声都接近纯音。"],
    ["口哨（滑音）", function () { var ph = 0; return tone(function (t) { ph += (1800 + 300 * Math.sin(2 * Math.PI * 1.5 * t)) / SR; return Math.sin(2 * Math.PI * ph); }); },
      "亮线上下弯曲：音高在变。读语谱图时，一条线往上走就是声音变高。"],
    ["元音“啊”", function () { return vowel([[800, 80], [1200, 90], [2500, 120]]); },
      "许多等距的横线是谐波（基频 200 Hz 的整数倍），横线在 800、1200 Hz 附近特别亮，这两处叫共振峰。"],
    ["元音“衣”", function () { return vowel([[300, 50], [2300, 100], [3000, 120]]); },
      "和“啊”的音高相同，但亮的位置变成了 300 Hz 和 2300 Hz 附近：舌头位置不同，共振峰就不同，这就是我们听得出是“衣”的原因。"],
    ["元音“乌”", function () { return vowel([[300, 50], [800, 80], [2300, 120]]); },
      "能量集中在 1000 Hz 以下，听起来“闷”：嘴唇拢圆，两个共振峰都很低。"],
    ["男声“啊”", function () { return vowel([[700, 80], [1100, 90], [2400, 120]], 110); },
      "基频降到 110 Hz，横线变得更密；共振峰位置和女声“啊”差不多，所以我们仍然听得出是“啊”。"],
    ["噪声", function () { return tone(function () { return (Math.random() * 2 - 1) * 0.5; }); },
      "整片均匀发亮：所有频率都有能量，没有音高。风声、空调声、“嘶嘶”的辅音（s、x）都像噪声。"],
    ["敲门声", function () { var x = new Float32Array(N); [0.2, 0.6, 1.0].forEach(function (s) { var i0 = Math.floor(s * SR); for (var i = 0; i < 800; i++) x[i0 + i] = (Math.random() * 2 - 1) * Math.exp(-i / 130); }); return x; },
      "几条竖线：时间很短、频率很宽的声音。说话里的“b、p、d、t”爆破音也是这样的竖线。"]
  ];
  var cur = 0, data = null;
  function fft(re, im) { var n = re.length; for (var i = 1, j = 0; i < n; i++) { var bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { var t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (var len = 2; len <= n; len <<= 1) { var ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (var i2 = 0; i2 < n; i2 += len) { var cr = 1, ci = 0; for (var k = 0; k < len / 2; k++) { var a = i2 + k, b = a + len / 2, xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi; var nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr; } } } }
  function color(v) { var r = Math.min(255, Math.max(0, 3 * v * 255)), g = Math.min(255, Math.max(0, (3 * v - 1) * 255)), b = Math.min(255, Math.max(0, (3 * v - 2) * 255 + 60 * (1 - v))); return [r, g, b]; }
  function draw() {
    var x = data, mx = 0; for (var i = 0; i < x.length; i++) mx = Math.max(mx, Math.abs(x[i]));
    var w = document.getElementById("wave"), c = w.getContext("2d"); c.clearRect(0, 0, w.width, w.height);
    c.strokeStyle = "#1e88e5"; c.beginPath();
    for (var px = 0; px < w.width; px++) { var a = Math.floor(px / w.width * x.length), b = Math.floor((px + 1) / w.width * x.length), lo = 0, hi = 0;
      for (var j = a; j < b; j++) { lo = Math.min(lo, x[j]); hi = Math.max(hi, x[j]); }
      c.moveTo(px, w.height / 2 - hi / mx * w.height * 0.45); c.lineTo(px, w.height / 2 - lo / mx * w.height * 0.45); }
    c.stroke();
    var s = document.getElementById("spec"), sc = s.getContext("2d"), NF = 512, hop = 128, cols = Math.floor((x.length - NF) / hop);
    var img = sc.createImageData(cols, NF / 2), frames = [], gmax = -1e9;
    for (var k = 0; k < cols; k++) { var re = new Float64Array(NF), im = new Float64Array(NF);
      for (var n = 0; n < NF; n++) re[n] = x[k * hop + n] * (0.5 - 0.5 * Math.cos(2 * Math.PI * n / NF));
      fft(re, im); var col = new Float64Array(NF / 2);
      for (var f = 0; f < NF / 2; f++) { col[f] = 10 * Math.log10(re[f] * re[f] + im[f] * im[f] + 1e-12); gmax = Math.max(gmax, col[f]); }
      frames.push(col); }
    for (var k2 = 0; k2 < cols; k2++) for (var f2 = 0; f2 < NF / 2; f2++) {
      var v = Math.max(0, Math.min(1, (frames[k2][f2] - gmax + 70) / 70)), rgb = color(v), p = ((NF / 2 - 1 - f2) * cols + k2) * 4;
      img.data[p] = rgb[0]; img.data[p + 1] = rgb[1]; img.data[p + 2] = rgb[2]; img.data[p + 3] = 255; }
    var tmp = document.createElement("canvas"); tmp.width = cols; tmp.height = NF / 2; tmp.getContext("2d").putImageData(img, 0, 0);
    sc.imageSmoothingEnabled = false; sc.drawImage(tmp, 0, 0, s.width, s.height);
    sc.fillStyle = "#fff"; sc.font = "12px sans-serif"; [0, 2000, 4000, 6000].forEach(function (hz) { sc.fillText(hz + " Hz", 4, s.height - hz / 8000 * s.height - 3); });
    document.getElementById("msg").textContent = SOUNDS[cur][2];
  }
  function pick(i) { cur = i; data = SOUNDS[i][1](); Array.prototype.forEach.call(document.querySelectorAll("#btns button"), function (b, k) { b.className = k === i ? "on" : ""; }); draw(); }
  SOUNDS.forEach(function (s, i) { var b = document.createElement("button"); b.textContent = s[0]; b.onclick = function () { pick(i); }; document.getElementById("btns").appendChild(b); });
  document.getElementById("play").onclick = function () {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; var ac = new AC(), buf = ac.createBuffer(1, data.length, SR), ch = buf.getChannelData(0), mx = 0;
    for (var i = 0; i < data.length; i++) mx = Math.max(mx, Math.abs(data[i])); for (var j = 0; j < data.length; j++) ch[j] = data[j] / mx * 0.5;
    var src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(); };
  pick(2);
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
