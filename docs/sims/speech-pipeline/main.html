<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音对话流水线</title>
<link rel="stylesheet" href="../common/sim.css">
<style>
.pipe { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
.stage { flex:1 1 90px; min-width:90px; padding:10px 6px; border:2px solid var(--line); border-radius:10px; text-align:center; cursor:pointer; background:#fafbfc; }
.stage b { display:block; font-size:15px; }
.stage span { font-size:12px; color:var(--muted); }
.stage.on { border-color:var(--accent); background:var(--soft); }
.arrow { color:var(--muted); font-size:18px; }
@media (max-width:620px) { .arrow { display:none; } }
.io { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
@media (max-width:620px) { .io { grid-template-columns:1fr; } }
.io .box { min-height:70px; }
.timeline { display:flex; height:26px; border-radius:6px; overflow:hidden; margin:6px 0; border:1px solid var(--line); }
.timeline div { color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; }
</style>
</head>
<body>
<h1>语音对话流水线：一句话从“说出口”到“听到回答”</h1>
<div class="sub">点击下面的五个环节，看每一步的输入、输出和花的时间。选择“理解”的做法，看总等待时间怎么变。</div>
<div class="pipe" id="pipe"></div>
<div class="io">
  <div class="box"><h2>输入</h2><div id="in"></div></div>
  <div class="box"><h2>输出</h2><div id="out"></div></div>
</div>
<div class="box"><h2>这一步在做什么</h2><div id="what"></div></div>
<div class="row">理解这一步用：
  <button class="on" id="rule">关键词规则</button>
  <button id="llm">大模型</button>
</div>
<div class="timeline" id="tl"></div>
<div class="msg" id="msg"></div>
<div class="note">耗时为编者在 4 核笔记本 CPU 上实测（实验 1-3：识别 7.0 秒的来电用 0.39 秒，合成 7.0 秒的回复用 0.53 秒，都不含第一次加载模型的时间）。唤醒按每 0.1 秒检查一次估算；“大模型”一栏是联网调用的示意值，实际快慢取决于网络和模型。</div>
<script>
(function () {
  var S = [
    { k: "wake", n: "唤醒", d: "听到暗号才开工", t: 0.1, c: "#8e24aa",
      i: "麦克风里一直有声音：电视声、说话声……“你好小站”",
      o: "检测到唤醒词“你好小站”，开始录下后面的话",
      w: "设备一直在“半睡半醒”地听，只认几个固定的词（唤醒词）。认出来以后才把后面的话交给识别，这样既省电，也不会把家里的闲聊都录下来。第 4 章实验 4-3 自己设置唤醒词。" },
    { k: "asr", n: "识别", d: "声音 → 文字", t: 0.39, c: "#1e88e5",
      i: "一段 7.0 秒的录音（每秒 16000 个数字）",
      o: "“你好，我想问一下这周六的垃圾分类宣传活动是几点开始？”",
      w: "语音识别把一串声音数字变成文字。第 3 章讲它的原理，第 4 章用三种模型比一比、做字幕。" },
    { k: "nlu", n: "理解", d: "他想问什么", t: 0.01, c: "#43a047",
      i: "识别出的文字",
      o: "话题：垃圾分类活动；想知道：开始时间",
      w: "从文字里找出用户的意图。最简单的是查关键词（实验 1-3 就是这样）；复杂的交给大模型。第 9 章会把两种做法都做一遍。" },
    { k: "nlg", n: "回答", d: "组织一句回复", t: 0.01, c: "#fb8c00",
      i: "意图 + 社区活动表",
      o: "“您好，本周六的垃圾分类宣传活动上午9点开始，地点在3号楼前，欢迎参加。”",
      w: "根据意图查资料、写回复。可以套模板，也可以让大模型写。" },
    { k: "tts", n: "合成", d: "文字 → 声音", t: 0.53, c: "#e53935",
      i: "回复的文字",
      o: "一段 7.0 秒的语音，从音箱里播放出来",
      w: "语音合成把文字读出来。第 5 章讲原理，第 6 章换音色、做有声书，第 8 章还能用指定的人的声音读（要先取得授权）。" }
  ];
  var cur = 1, useLLM = false;
  var pipe = document.getElementById("pipe");
  S.forEach(function (s, i) {
    if (i) { var a = document.createElement("span"); a.className = "arrow"; a.textContent = "→"; pipe.appendChild(a); }
    var d = document.createElement("div"); d.className = "stage"; d.id = "st" + i;
    d.innerHTML = "<b>" + (i + 1) + ". " + s.n + "</b><span>" + s.d + "</span>";
    d.onclick = function () { cur = i; render(); };
    pipe.appendChild(d);
  });
  function times() { return S.map(function (s) { return s.k === "nlu" || s.k === "nlg" ? (useLLM ? (s.k === "nlu" ? 0.6 : 0.9) : 0.01) : s.t; }); }
  function render() {
    S.forEach(function (s, i) { document.getElementById("st" + i).className = "stage" + (i === cur ? " on" : ""); });
    var s = S[cur], ts = times();
    document.getElementById("in").textContent = s.i;
    document.getElementById("out").textContent = (useLLM && s.k === "nlg") ? "大模型写出的回复，内容更灵活，但可能编造活动时间，要让它只根据活动表回答" : s.o;
    document.getElementById("what").textContent = s.w + "  本步约 " + ts[cur].toFixed(2) + " 秒。";
    var total = ts.reduce(function (a, b) { return a + b; }, 0);
    var tl = document.getElementById("tl"); tl.innerHTML = "";
    S.forEach(function (x, i) {
      var d = document.createElement("div"); d.style.width = (ts[i] / total * 100) + "%"; d.style.background = x.c;
      d.textContent = ts[i] / total > 0.08 ? x.n + " " + ts[i].toFixed(2) + "s" : ""; tl.appendChild(d);
    });
    document.getElementById("msg").textContent = "说完话到开始播放回答，大约要等 " + total.toFixed(2) + " 秒" +
      (total < 1.5 ? "，感觉很跟手。" : "，已经能感觉到停顿了，第 9 章讲怎么让它更快。");
    document.getElementById("rule").className = useLLM ? "" : "on";
    document.getElementById("llm").className = useLLM ? "on" : "";
  }
  document.getElementById("rule").onclick = function () { useLLM = false; render(); };
  document.getElementById("llm").onclick = function () { useLLM = true; render(); };
  render();
})();
</script>
<script src="../common/sim.js"></script>
</body>
</html>
