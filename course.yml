# ============================================================
# 课程配置：全书唯一需要手改的配置文件
# 改完后运行  python tools/course.py sync  ，会自动更新：
#   mkdocs.yml 的站点名和导航、首页课程信息与目录、缺少的章节骨架、
#   实验目录、术语表的章节小节、学习图谱的章节列表、附录编号
# 课件（tools/make_slides.py）、教案（tools/make_lesson_plan.py）、Word/PDF 版（tools/export_docx.py）
# 也从这里读取课程名、学时等信息
# ============================================================

title: TTS、SST 与语音克隆的理论与应用   # 书名
description: 面向成人教育人工智能技术应用专业（专科）的《TTS、SST 与语音克隆的理论与应用》教材，9 章 36 个动手实验，识别、合成、声纹、克隆大多在普通电脑 CPU 上离线完成
audience: 成人教育（继续教育）人工智能技术应用专业专科学生，多为在职学习者
github_user: MingziFu9                # 网址 https://<github_user>.github.io/<repo>/
repo: speech-textbook                 # GitHub 仓库名

credits: 4                            # 学分
hours: {theory: 36, lab: 36}          # 学时：理论 + 实验
semester: 4                           # 开课学期
exam: 开卷                            # 期末考核方式
labs_per_chapter: 4                   # 每章实验数；0 表示没有实验
lab_section: 本章实验                 # 实验部分的二级标题；导论用“在线体验”
lab_word: 实验                        # 每个实验的三级标题前缀（### 实验 N-M）；导论用“体验”
frontier_title: 前沿视窗              # 每章“前沿”小节的名称，导论用“身边的 AI”
certificates: []                      # 人才培养方案没有给本课挂证书

# 章节：dir 是 docs/chapters/ 下的文件夹名（两位章号开头），short 用于学习图谱等窄处
# theory / lab 是本章学时；labs 可单独覆盖本章实验数；offline 可指定本章线下学时（不写则按 online_ratio 分）
chapters:
  - {dir: 01-overview, title: "走进语音技术", short: "语音技术概览", theory: 4, lab: 4, offline: 1}
  - {dir: 02-audio, title: "声音的数字化与音频处理", short: "声音与音频处理", theory: 4, lab: 4, offline: 1}
  - {dir: 03-asr-principles, title: "语音识别原理：从模板匹配到深度学习", short: "识别原理", theory: 4, lab: 4, offline: 1}
  - {dir: 04-asr-practice, title: "语音识别实战：转写、字幕与唤醒", short: "识别实战", theory: 4, lab: 4, offline: 1}
  - {dir: 05-tts-principles, title: "语音合成原理：从文字到声音", short: "合成原理", theory: 4, lab: 4, offline: 2}
  - {dir: 06-tts-practice, title: "语音合成实战：多音色与有声书", short: "合成实战", theory: 4, lab: 4, offline: 2}
  - {dir: 07-speaker, title: "声纹识别与语音转换", short: "声纹与变声", theory: 4, lab: 4, offline: 2}
  - {dir: 08-voice-cloning, title: "语音克隆：技术、伦理与授权", short: "语音克隆", theory: 4, lab: 4, offline: 2}
  - {dir: 09-applications, title: "语音交互应用与综合项目", short: "应用与项目", theory: 4, lab: 4, offline: 2}

# 其他页面：追加在导航“常见问题”之后，如 extra_pages: [{file: mock-exam.md, title: 在线模拟卷}]
extra_pages: [{file: mock-exam.md, title: 在线模拟卷}]

# 附录：docs/appendix/ 下的文件，按顺序自动编号为 A、B、C……（术语表固定为 glossary.md）
appendices:
  - {file: a-libraries.md, title: sherpa-onnx 与音频处理速查}
  - {file: b-environment.md, title: 实验环境、模型与数据说明}
  - {file: glossary.md, title: 术语表}
  - {file: d-templates.md, title: 实验报告、声音授权书与项目模板}

# 教案默认设置（每章可在 lesson-plans/chNN.yml 里覆盖）
lesson_plan:
  online_ratio: 0.5                   # 线上学时占比（开放大学以线上为主，按实际改）
  teacher: ""                         # 授课教师，留空则教案上留出填写位置
  school: ""                          # 学校名称，留空则不显示
