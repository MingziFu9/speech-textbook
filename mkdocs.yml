# 站点名、描述、网址和 nav 由 python tools/course.py sync 根据 course.yml 生成，请改 course.yml，不要手改这几项
site_name: TTS、SST 与语音克隆的理论与应用
site_description: 面向成人教育人工智能技术应用专业（专科）的《TTS、SST 与语音克隆的理论与应用》教材，9 章 36 个动手实验，识别、合成、声纹、克隆大多在普通电脑 CPU 上离线完成
site_url: https://mingzifu9.github.io/speech-textbook/
repo_url: https://github.com/MingziFu9/speech-textbook
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - css/extra.css
  - css/showcase.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/book.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/showcase.js
nav:
  - 首页: index.md
  - 课程描述: course-description.md
  - "第 1 章 走进语音技术": chapters/01-overview/index.md
  - "第 2 章 声音的数字化与音频处理": chapters/02-audio/index.md
  - "第 3 章 语音识别原理：从模板匹配到深度学习": chapters/03-asr-principles/index.md
  - "第 4 章 语音识别实战：转写、字幕与唤醒": chapters/04-asr-practice/index.md
  - "第 5 章 语音合成原理：从文字到声音": chapters/05-tts-principles/index.md
  - "第 6 章 语音合成实战：多音色与有声书": chapters/06-tts-practice/index.md
  - "第 7 章 声纹识别与语音转换": chapters/07-speaker/index.md
  - "第 8 章 语音克隆：技术、伦理与授权": chapters/08-voice-cloning/index.md
  - "第 9 章 语音交互应用与综合项目": chapters/09-applications/index.md
  - 交互动画:
    - sims/index.md
    - "语音对话流水线": sims/speech-pipeline/index.md
    - "采样与量化": sims/sampling-quantization/index.md
    - "看见声音": sims/spectrogram-viewer/index.md
    - "字错率计算器": sims/cer-calculator/index.md
    - "CTC 折叠": sims/ctc-collapse/index.md
    - "DTW 对齐": sims/dtw-align/index.md
    - "VAD 切句": sims/vad-segment/index.md
    - "文本前端流水线": sims/frontend-pipeline/index.md
    - "从频谱到声音": sims/vocoder-compare/index.md
    - "音色与语速调台": sims/voice-speed/index.md
    - "门槛与两种错误": sims/threshold-errors/index.md
    - "声纹地图": sims/voiceprint-map/index.md
    - "这样克隆合规吗": sims/clone-compliance/index.md
    - "参考时长与相似度": sims/clone-settings/index.md
    - "延迟拆解": sims/latency-breakdown/index.md
  - 学习图谱: learning-graph/index.md
  - 常见问题: faq/index.md
  - "在线模拟卷": mock-exam.md
  - 附录:
    - "附录 A sherpa-onnx 与音频处理速查": appendix/a-libraries.md
    - "附录 B 实验环境、模型与数据说明": appendix/b-environment.md
    - "附录 C 术语表": appendix/glossary.md
    - "附录 D 实验报告、声音授权书与项目模板": appendix/d-templates.md
